<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Calculatrice Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculatrice">
        <input type="text" id="ecran" readonly>
        <div class="touches">
            <button onclick="ajouterCaractere('7')">7</button>
            <button onclick="ajouterCaractere('8')">8</button>
            <button onclick="ajouterCaractere('9')">9</button>
            <button onclick="ajouterCaractere('+')" class="operateur">+</button>
            <button onclick="calculer()" class="egal">=</button>
            <button onclick="ajouterCaractere('-')" class="operateur">-</button>
            <button onclick="ajouterCaractere('*')" class="operateur">×</button>
            </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
